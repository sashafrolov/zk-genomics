[package]
name = "merkle-trees"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bellpepper-core = { version = "0.4.0", default-features = false }
bellpepper = { version = "0.4.0", default-features = false }
ff = { version = "0.13", features = ["derive"] }
num-bigint = "0.4.3"
bellpepper-nonnative = { git = "https://github.com/avras/bellperson-nonnative.git" }
neptune = "13.0.0"
spartan2 = { path = "../Spartan2" }
rand = "0.8.5"
generic-array = "1.0.0"
rayon = "1.10"
rs_merkle = "1.4"
sha2 = "0.10"

# Plonky3 dependencies for BabyBear + Poseidon2 Merkle tree
p3-baby-bear = "0.4.2"
p3-commit = "0.4.2"
p3-field = "0.4.2"
p3-matrix = "0.4.2"
p3-merkle-tree = "0.4.2"
p3-poseidon2 = "0.4.2"
p3-symmetric = "0.4.2"

[dev-dependencies]
generic-array = "1.0.0"
pasta_curves = "0.5.1"
